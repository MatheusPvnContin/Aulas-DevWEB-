<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 16 - Praticando 1 com jQuery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Importação do jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    
<div class="container mt-5">
    <h1>Praticando 1 - Mostrar/Esconder com jQuery</h1>
    

    <div class="d-flex justify-content-between mb-4">
        <button id="btnMostrar" class="btn btn-primary">Mostrar</button>
        <button id="btnAlternar" class="btn btn-primary">Alternar</button>
        <button id="btnEsconder" class="btn btn-primary">Esconder</button>
    </div>


    <div id="caixa" class="p-5 text-center bg-primary-subtle border">
        <h2 class="display-4">Meu DIV</h2>
    </div>
</div>

    <script>
        $(function () {
            $("#btnEsconder").on("click", function () {
                $("#caixa").hide();
            });

            $("#btnMostrar").on("click", function () {
                $("#caixa").show();
            });

            $("#btnAlternar").on("click", function () {
                $("#caixa").toggle();
            });
        });
    </script>
</body>
</html>
