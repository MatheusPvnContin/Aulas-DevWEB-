<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 16 - Praticando 2 com jQuery</title>

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Importação do jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            min-height: 100vh;
            background-color: white;
        }

        #caixas {
            display: flex;
            gap: 16px;
            margin: 24px 0;
        }

        .caixa {
            flex: 1;
            height: 50px;
            border: 3px solid black;
            cursor: pointer;
        }

        #preview {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            font-style: italic;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container mt-4">
        <h1>Praticando 2 - Cores (click e mouse) com jQuery</h1>

        <div id="caixas">
            <div class="caixa" data-cor="red" style="background-color: red;"></div>
            <div class="caixa" data-cor="green" style="background-color: green;"></div>
            <div class="caixa" data-cor="blue" style="background-color: blue;"></div>
            <div class="caixa" data-cor="yellow" style="background-color: yellow;"></div>
            <div class="caixa" data-cor="magenta" style="background-color: magenta;"></div>
        </div>

        <button id="btnReset" class="btn btn-light border fs-3">Reset</button>
    </div>

    <div id="preview">Preview</div>

    <script>
        $(function () {
            let corFixada = localStorage.getItem("corFundo") ?? "white";
            $("body").css("background-color", corFixada);

            // CLICK: fixa a cor da caixa clicada no fundo e salva no LocalStorage
            $(".caixa").on("click", function () {
                corFixada = $(this).data("cor");
                $("body").css("background-color", corFixada);
                localStorage.setItem("corFundo", corFixada);
            });

            // HOVER: substitui mouseover e mouseout em um único método
            $(".caixa").hover(
                function () { // mouse entrou
                    const cor = $(this).data("cor");
                    $("body").css("background-color", cor);
                    $("#preview").show();
                },
                function () { // mouse saiu
                    $("body").css("background-color", corFixada);
                    $("#preview").hide();
                }
            );

            // RESET: volta o fundo para branco e limpa o LocalStorage
            $("#btnReset").on("click", function () {
                corFixada = "white";
                $("body").css("background-color", "white");
                localStorage.removeItem("corFundo");
            });
        });
    </script>

</body>
</html>
