 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 16 - Praticando 3 com jQuery</title>
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        .img-item {
            width: 200px;
            margin: 10px;
        }
    </style>
</head>
<body class="p-4">

    <h1 class="mb-4">Aula 16 - Praticando 3</h1>

    <div class="row mb-4">
        <!-- Coluna: Lado -->
        <div class="col-md-3">
            <h5>Lado</h5>
            <div class="btn-group" role="group">
                <button type="button" id="btnEsquerdo" class="btn btn-primary">Esquerdo</button>
                <button type="button" id="btnDireito" class="btn btn-outline-primary">Direito</button>
            </div>
        </div>

        <!-- Coluna: Parágrafos -->
        <div class="col-md-5">
            <h5>Parágrafos</h5>
            <button type="button" id="btnAddP" class="btn btn-primary">Adicionar</button>
            <button type="button" id="btnRemPrimeiroP" class="btn btn-primary">Remover primeiro</button>
            <button type="button" id="btnRemUltimoP" class="btn btn-primary">Remover último</button>
            <button type="button" id="btnRemTodosP" class="btn btn-primary">Remover todos</button>
        </div>

        <!-- Coluna: Imagens -->
        <div class="col-md-4">
            <h5>Imagens</h5>
            <button type="button" id="btnAddImg" class="btn btn-primary">Adicionar</button>
            <button type="button" id="btnRemUmaImg" class="btn btn-primary">Remover uma</button>
            <button type="button" id="btnRemTodasImg" class="btn btn-primary">Remover todas</button>
        </div>
    </div>

    <div class="row">
        <div id="areaEsquerda" class="col-md-8"></div>
        <div id="areaDireita" class="col-md-4"></div>
    </div>

    <script>
        $(function () {
            const areaEsquerda = $("#areaEsquerda");
            const areaDireita = $("#areaDireita");
            const btnEsquerdo = $("#btnEsquerdo");
            const btnDireito = $("#btnDireito");

            let areaAtiva = areaEsquerda;
            let contadorParagrafos = 0;

            function moverElementosPara(destino) {
                const origem = destino.is("#areaEsquerda") ? areaDireita : areaEsquerda;
                destino.append(origem.children());
            }

            // Controle de Lado
            btnEsquerdo.on("click", function () {
                areaAtiva = areaEsquerda;
                btnEsquerdo.removeClass("btn-outline-primary").addClass("btn-primary");
                btnDireito.removeClass("btn-primary").addClass("btn-outline-primary");
                moverElementosPara(areaEsquerda);
            });

            btnDireito.on("click", function () {
                areaAtiva = areaDireita;
                btnDireito.removeClass("btn-outline-primary").addClass("btn-primary");
                btnEsquerdo.removeClass("btn-primary").addClass("btn-outline-primary");
                moverElementosPara(areaDireita);
            });

            // Controle de Parágrafos
            $("#btnAddP").on("click", function () {
                contadorParagrafos++;
                areaAtiva.append(`<p>#${contadorParagrafos} - Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>`);
            });

            $("#btnRemPrimeiroP").on("click", function () {
                areaAtiva.find("p").first().remove();
            });

            $("#btnRemUltimoP").on("click", function () {
                areaAtiva.find("p").last().remove();
            });

            $("#btnRemTodosP").on("click", function () {
                $("#areaEsquerda p, #areaDireita p").remove();
            });

            $("#btnAddImg").on("click", function () {
            areaAtiva.append('<img src="gatinho.jpg" alt="Imagem adicionada" class="img-item">');
});

            $("#btnRemUmaImg").on("click", function () {
                areaAtiva.find("img").last().remove();
            });

            $("#btnRemTodasImg").on("click", function () {
                $("#areaEsquerda img, #areaDireita img").remove();
            });
        });
    </script>
</body>
</html>
