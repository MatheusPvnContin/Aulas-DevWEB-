<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 15 - Praticando 5</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        /* Estilo base dos quadrados: inline-block evita que o movimento de um empurre os outros */
        .quadrado {
            display: inline-block;
            vertical-align: top;
            width: 120px;
            height: 120px;
            border: 4px solid black;
            margin-right: 15px;
            cursor: pointer;
            position: relative; /* Permite mover livremente usando top e left sem afetar o fluxo da página */
            top: 0px;
            left: 0px;
        }

        .vermelho { background-color: red; }
        .azul { background-color: blue; }
        .verde { background-color: green; }

       
        .selecionado {
            border-color: yellow;
            z-index: 100;
        }
    </style>
</head>
<body class="p-4">

    <div class="container">
        <h1 class="mb-3">Praticando 5 - Mini-game JS</h1>

        <!-- Instruções -->
        <p class="mb-1"><strong><u>Instruções:</u></strong></p>
        <ol>
            <li>Clique em um dos quadrados coloridos</li>
            <li>Depois use as teclas <strong> <mark>W</mark> <mark>A</mark> <mark>S</mark> <mark>D</mark></strong> 
                para movimentar os elementos para cima, esquerda, baixo e direita respectivamente.</li>
        </ol>

        <div class="text-center my-4">
         
            <img src="Material de Aula 15c/wasd.jpg" alt="Controles WASD e Setas" style="max-width: 280px;">
        </div>

        <!-- Quadrados alinhados à esquerda -->
        <div class="mt-4">
            <div class="quadrado vermelho"></div>
            <div class="quadrado azul"></div>
            <div class="quadrado verde"></div>
        </div>
    </div>

    <script>
        const quadrados = document.querySelectorAll(".quadrado");
        let quadradoSelecionado = null;
        const passo = 15; // Velocidade de movimento em pixels

       
        quadrados.forEach(quad => {
            quad.addEventListener("click", function () {
                // Se clicar no mesmo quadrado selecionado -> reseta posição e desseleciona
                if (quadradoSelecionado === quad) {
                    quad.classList.remove("selecionado");
                    quad.style.top = "0px";
                    quad.style.left = "0px";
                    quadradoSelecionado = null;
                } 
                // Se já houver outro selecionado -> avisa e impede
                else if (quadradoSelecionado !== null) {
                    alert("Atenção! Já há um quadrado selecionado, desselecione-o antes de selecionar outro.");
                } 
                // Seleciona o quadrado clicado
                else {
                    quadradoSelecionado = quad;
                    quad.classList.add("selecionado");
                }
            });
        });

        // 2. Movimentação livre com WASD 
        document.addEventListener("keydown", function (event) {
            if (!quadradoSelecionado) return;

            let topoAtual = parseInt(quadradoSelecionado.style.top);
            if (isNaN(topoAtual)) topoAtual = 0;

            let esquerdaAtual = parseInt(quadradoSelecionado.style.left);
            if (isNaN(esquerdaAtual)) esquerdaAtual = 0;

            switch (event.code) {
                case "KeyW": // Cima
                    quadradoSelecionado.style.top = (topoAtual - passo) + "px";
                    break;
                case "KeyS": // Baixo
                    quadradoSelecionado.style.top = (topoAtual + passo) + "px";
                    break;
                case "KeyA": // Esquerda
                    quadradoSelecionado.style.left = (esquerdaAtual - passo) + "px";
                    break;
                case "KeyD": // Direita
                    quadradoSelecionado.style.left = (esquerdaAtual + passo) + "px";
                    break;
            }
        });
    </script>
</body>
</html>
