<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 15 - Praticando 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
<div class="container mt-5">
    <h1 >Praticando 1 - Mostrar/Esconder</h1>
    
    <!-- 1. Div com Flexbox para jogar um botão de cada lado -->
    <div class="d-flex justify-content-between mb-4">
        <button id="btnMostrar" class="btn btn-primary">Mostrar</button>
        <button id="btnEsconder" class="btn btn-primary">Esconder</button>
    </div>

    <!-- 2. Div centralizada, fundo azul claro (bg-primary-subtle ou customizado) e texto centralizado -->
    <div id="caixa" class="p-5 text-center bg-primary-subtle border">
        <h2 class="display-4">Meu DIV</h2>
    </div>
</div>

    <script>
        const btnMostrar = document.getElementById("btnMostrar");
        const btnEsconder = document.getElementById("btnEsconder");
        const caixa = document.getElementById("caixa");

        btnEsconder.addEventListener("click", function () {
            caixa.style.display = "none";
        });

        btnMostrar.addEventListener("click", function () {
            caixa.style.display = "block";
        });
    </script>
</body>
</html>
