<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando 3 - Formulário com validações</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <div class="container">
        <h1 class="h3 mb-4">Praticando 3 - Formulário com validações</h1>

        <form id="meuFormulario" class="row g-3">
            <!-- Nome -->
            <div class="col-md-6">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control is-invalid" id="nome">
                <div class="invalid-feedback">Informe seu nome completo</div>
                <div class="valid-feedback">Tudo certo!</div>
            </div>

            <!-- E-mail -->
            <div class="col-md-6">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control is-invalid" id="email" placeholder="seu@email.aqui">
                <div class="invalid-feedback">Informe um endereço de email válido</div>
                <div class="valid-feedback">Tudo certo!</div>
            </div>

            <!-- Telefone -->
            <div class="col-md-6">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="text" class="form-control is-invalid" id="telefone">
                <div class="invalid-feedback">Informe um telefone de contato</div>
                <div class="valid-feedback">Tudo certo!</div>
            </div>

            <!-- Idade -->
            <div class="col-md-6">
                <label for="idade" class="form-label">Idade</label>
                <select class="form-select is-invalid" id="idade">
                    <option value="" selected>[Escolha uma opção]</option>
                    <option value="18">Menos de 18 anos</option>
                    <option value="19-25">19 a 25 anos</option>
                    <option value="26-35">26 a 35 anos</option>
                    <option value="36+">Mais de 36 anos</option>
                </select>
                <div class="invalid-feedback">Escolha a opção que representa sua idade atual</div>
                <div class="valid-feedback">Tudo certo!</div>
            </div>

            <!-- Observações -->
            <div class="col-12">
                <label for="observacoes" class="form-label">Observações</label>
                <textarea class="form-control is-invalid" id="observacoes" rows="3"></textarea>
                <div class="invalid-feedback">Informe alguma observação</div>
                <div class="valid-feedback">Tudo certo!</div>
            </div>

            <!-- Botões -->
            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary">Enviar</button>
                <button type="reset" id="btnLimpar" class="btn btn-warning">Limpar</button>
            </div>
        </form>
    </div>

    <script>
        // Seleciona todos os campos de entrada do formulário
        const campos = document.querySelectorAll("#nome, #email, #telefone, #idade, #observacoes");
        const form = document.getElementById("meuFormulario");
        const btnLimpar = document.getElementById("btnLimpar");

        // Função para validar um campo específico
        function validarCampo(campo) {
            // Se o campo tiver algum valor preenchido (não vazio após remover espaços)
            if (campo.value.trim() !== "") {
                campo.classList.remove("is-invalid");
                campo.classList.add("is-valid");
            } else {
                campo.classList.remove("is-valid");
                campo.classList.add("is-invalid");
            }
        }

        // Adiciona ouvintes de evento para validar dinamicamente enquanto o usuário digita ou altera
        campos.forEach(campo => {
            campo.addEventListener("input", function () {
                validarCampo(campo);
            });
            campo.addEventListener("change", function () {
                validarCampo(campo);
            });
        });

        // Evita o recarregamento ao enviar o formulário
        form.addEventListener("submit", function (e) {
            e.preventDefault();
        });

        // Restaura a marcação vermelha inicial ao clicar no botão "Limpar"
        btnLimpar.addEventListener("click", function () {
            setTimeout(() => {
                campos.forEach(campo => {
                    campo.classList.remove("is-valid");
                    campo.classList.add("is-invalid");
                });
            }, 0);
        });
    </script>
</body>
</html>
