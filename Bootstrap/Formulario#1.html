<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" 
               integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" 
                integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>


</head>
<body>
    <main class="container py-4">
        <h1 class="mb-4">Formulário de cadastro</h1>
        <form>
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email">
            </div>
            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="tel" class="form-control" id="telefone" name="telefone">
            </div>
            <div class="mb-3">
                <label for="site" class="form-label">Site</label>
                <input type="url" class="form-control" id="site" name="site">
            </div>
            <div class="mb-3">
                <label for="idade" class="form-label">Idade</label>
                <input type="number" class="form-control" id="idade" name="idade">
            </div>
            <div class="mb-3">
                <label for="dataNascimento" class="form-label">Data de nascimento</label>
                <input type="date" class="form-control" id="dataNascimento" name="dataNascimento">
            </div>
            <div class="mb-3">
                <label for="arquivo" class="form-label">Enviar arquivo</label>
                <input type="file" class="form-control" id="arquivo" name="arquivo">
            </div>
            <div class="mb-3">
                <label for="assunto" class="form-label">Assunto</label>
                <select class="form-select" id="assunto" name="assunto">
                    <option value="" selected>Selecione uma opção</option>
                    <option value="duvida">Dúvida</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="outro">Outro</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="mensagem" class="form-label">Mensagem</label>
                <textarea class="form-control" id="mensagem" name="mensagem" rows="4"></textarea>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="aceite" name="aceite">
                <label class="form-check-label" for="aceite">Aceito os termos</label>
            </div>
            <fieldset class="mb-3">
                <legend class="form-label">Interesses</legend>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="interesseTecnologia" name="interesses" value="tecnologia">
                    <label class="form-check-label" for="interesseTecnologia">Tecnologia</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="interesseDesign" name="interesses" value="design">
                    <label class="form-check-label" for="interesseDesign">Design</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="interesseEducacao" name="interesses" value="educacao">
                    <label class="form-check-label" for="interesseEducacao">Educação</label>
                </div>
            </fieldset>
            <button type="submit" class="btn btn-primary">Enviar</button>
            <button type="reset" class="btn btn-secondary">Limpar</button>
        </form>
    </main>
</body>
</html>
