<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Feedback - PavamDoca</title>

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" 
               integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
   <!-- Bootstrap Icons, usado só no ícone do título -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" 
                integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="sobre.html"><i class="bi bi-cup-hot-fill text-warning"></i> PavamDoca</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
                    <li class="nav-item"><a class="nav-link" href="cardapio.html">Cardápio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="Formulario.html">Deixar feedback</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4" style="max-width: 700px;">

        <h1 class="mb-3 mt-4">Formulário de feedback</h1>
        <p class="text-muted">Conte pra gente como foi sua experiência</p>

        
        <div class="alert alert-info" role="alert">
            Este formulário é apenas um exercício de prática. Os dados preenchidos não são enviados a lugar nenhum.
        </div>

        <form>
            <div class="mb-3">
                <label for="nome" class="form-label">Seu nome</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome completo">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="seuemail@exemplo.com">
            </div>

            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone / WhatsApp</label>
                <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(17) 99999-9999">
            </div>

            <div class="mb-3">
                <label for="instagram" class="form-label">Seu perfil no Instagram (opcional)</label>
                <input type="url" class="form-control" id="instagram" name="instagram" placeholder="https://instagram.com/seuusuario">
            </div>

            <div class="mb-3">
                <label for="nota" class="form-label">Nota geral para a padaria (0 a 10)</label>
                <input type="number" class="form-control" id="nota" name="nota" min="0" max="10" placeholder="Ex: 9">
            </div>

            <div class="mb-3">
                <label for="dataVisita" class="form-label">Data da sua visita</label>
                <input type="date" class="form-control" id="dataVisita" name="dataVisita">
            </div>

            <div class="mb-3">
                <label for="foto" class="form-label">Anexar uma foto do produto (opcional)</label>
                <input type="file" class="form-control" id="foto" name="foto">
            </div>

            <div class="mb-3">
                <label for="assunto" class="form-label">O que você está avaliando?</label>
                <select class="form-select" id="assunto" name="assunto">
                    <option value="" selected>Selecione uma opção</option>
                    <option value="atendimento">Atendimento</option>
                    <option value="qualidade">Qualidade dos produtos</option>
                    <option value="ambiente">Ambiente da loja</option>
                    <option value="preco">Preço</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="mensagem" class="form-label">Conte mais sobre sua experiência</label>
                <textarea class="form-control" id="mensagem" name="mensagem" rows="4" placeholder="Escreva aqui seu comentário..."></textarea>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="recomendaria" name="recomendaria">
                <label class="form-check-label" for="recomendaria">Eu recomendaria a PavamDoca para um amigo</label>
            </div>

            <fieldset class="mb-3">
                <legend class="form-label">O que você mais gostou? (marque quantos quiser)</legend>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="gostouPaes" name="gostou" value="paes">
                    <label class="form-check-label" for="gostouPaes">Pães</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="gostouBolos" name="gostou" value="bolos">
                    <label class="form-check-label" for="gostouBolos">Bolos e doces</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="gostouSalgados" name="gostou" value="salgados">
                    <label class="form-check-label" for="gostouSalgados">Salgados</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="gostouAtendimento" name="gostou" value="atendimento">
                    <label class="form-check-label" for="gostouAtendimento">Atendimento</label>
                </div>
            </fieldset>

            <button type="submit" class="btn btn-primary">Enviar feedback</button>
            <button type="reset" class="btn btn-secondary">Limpar</button>
        </form>
    </main>
</body>
</html>
