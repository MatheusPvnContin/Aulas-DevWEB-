<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando 4 - Caixas verdes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            margin: 2rem;
        }

        .caixa {
            background-color: green;
            margin: 1rem;
        }

        
        .pequena {
            width: 8rem;
            height: 8rem;
        }

        .larga {
            width: 24rem;
            height: 8rem;
        }

        
        .alta {
            width: 8rem;
            height: 24rem;
        }

       
        .flutua-direita {
            float: right;
        }

        .flutua-esquerda {
            float: left;
        }

        
        .lado-a-lado {
            clear: both;
            
            display: inline-block;
            vertical-align: top;
        }

        
        .primeira-alta {
            clear: both;
        }
    </style>
</head>

<body>
    <!--
        PRATICANDO 4 - Caixas verdes
        ========================================================
        - 8 caixas com altura e largura definidas.
        - Margens externas em todas.
        - Posicionamento horizontal em algumas (aqui: display: inline-block,
          sem usar float, para ficarem lado a lado alinhadas à esquerda).
        - Flutuação (float) em algumas outras.
    -->
    <h1>Praticando 4 - Caixas verdes</h1>

    
    <div class="caixa pequena flutua-direita"></div>
    <div class="caixa pequena flutua-direita"></div>
    <div class="caixa pequena flutua-direita"></div>

    
    <div class="caixa larga lado-a-lado"></div>
    <div class="caixa larga lado-a-lado"></div>

    <div class="caixa alta flutua-esquerda primeira-alta"></div>

    
    <div class="caixa alta flutua-direita"></div>
    <div class="caixa alta flutua-direita"></div>
</body>

</html>
