<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando 4 - Caixas verdes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            margin: 2rem;
        }

        .caixa {
            background-color: green;
            margin: 1rem;
            
        }

        
        .linha {
            display: flex;
        }

        
        .linha-pequenas {
            justify-content: flex-end;
        }

        .pequena {
            width: 8rem;
            height: 8rem;
        }

        
        .larga {
            width: 24rem;
            height: 8rem;
        }

        
        .alta {
            width: 8rem;
            height: 24rem;
        }

        
        .linha-altas {
            justify-content: space-between;
        }

        .grupo-direita {
            display: flex;
        }
    </style>
</head>

<body>

    <h1>Praticando 4 - Caixas verdes</h1>

   
    <div class="linha linha-pequenas">
        <div class="caixa pequena"></div>
        <div class="caixa pequena"></div>
        <div class="caixa pequena"></div>
    </div>

   
    <div class="linha linha-largas">
        <div class="caixa larga"></div>
        <div class="caixa larga"></div>
    </div>

   
    <div class="linha linha-altas">
        <div class="caixa alta"></div>

        <div class="grupo-direita">
            <div class="caixa alta"></div>
            <div class="caixa alta"></div>
        </div>
    </div>
</body>

</html>
