<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> PRATICANDO 2 Somente unidades relativas</title>
    
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Lobster&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
}

h1 {
    font-family: 'Lobster', cursive;
    font-size: 1.6rem;      
    padding: 1vh 2vw;       
    margin: 0;
}

h2 {
    font-family: 'Lobster', cursive;
    font-size: 3vw;          
    margin: 0 0 2vh 0;
}


.secao-verde {
    background-color: lightgreen;
    border-top: 0.6vh solid navy;
    border-bottom: 0.6vh solid navy;
    padding: 2vh 2vw;
    text-align: left;
}


.secao-rosa {
    background-color: lightcoral;
    border-top: 0.6vh solid chocolate;
    border-bottom: 0.6vh solid chocolate;
    padding: 2vh 2vw;
    text-align: right;
}

.galeria {
    display: flex;
    align-items: flex-end;   
    gap: 1.5vw;
    flex-wrap: wrap;
}

.secao-rosa .galeria {
    justify-content: flex-end;
}

.lhama {
    display: block;
    height: auto;
    border-radius: 0.5em;
}


.tam-1 { width: 8%; }
.tam-2 { width: 16%; }
.tam-3 { width: 24%; }
.tam-4 { width: 32%; }


</style>

</head>

<body>
    
    <!--
        PRATICANDO 2 - Lhama, lhama, lhama!
        ========================================================
        Regra principal: SÓ pode usar unidades RELATIVAS
        (%, vw, vh, em, rem) em tamanhos, fontes, bordas e margens.
        Nada de px, cm, in, pt (unidades absolutas).

        Objetivo: ao redimensionar a janela do navegador (sem dar zoom),
        o texto, as caixas e as imagens devem mudar de tamanho junto,
        porque tudo está em unidades relativas ao viewport/ao elemento pai.
    -->
    <h1>Praticando 2 - Aula 9a - Lhama, lhama, lhama!</h1>

    <section class="secao-verde">
        <h2>Lhama, lhama, lhama!</h2>
        <div class="galeria">
            <img src="https://ichef.bbci.co.uk/news/640/cpsprodpb/DED5/production/_104154075_gettyimages-154948449.jpg"
                alt="Lhama 1" class="lhama tam-1">
            <img src="https://ichef.bbci.co.uk/news/640/cpsprodpb/DED5/production/_104154075_gettyimages-154948449.jpg"
                alt="Lhama 2" class="lhama tam-2">
            <img src="https://ichef.bbci.co.uk/news/640/cpsprodpb/DED5/production/_104154075_gettyimages-154948449.jpg"
                alt="Lhama 3" class="lhama tam-3">
            <img src="https://ichef.bbci.co.uk/news/640/cpsprodpb/DED5/production/_104154075_gettyimages-154948449.jpg"
                alt="Lhama 4" class="lhama tam-4">
        </div>
    </section>

    <section class="secao-rosa">
        <h2>Lhama, lhama, lhama?</h2>
        <div class="galeria">
            <img src="https://ichef.bbci.co.uk/news/640/cpsprodpb/DED5/production/_104154075_gettyimages-154948449.jpg"
                alt="Lhama 5" class="lhama tam-4">
            <img src="https://ichef.bbci.co.uk/news/640/cpsprodpb/DED5/production/_104154075_gettyimages-154948449.jpg"
                alt="Lhama 6" class="lhama tam-3">
            <img src="https://ichef.bbci.co.uk/news/640/cpsprodpb/DED5/production/_104154075_gettyimages-154948449.jpg"
                alt="Lhama 7" class="lhama tam-2">
            <img src="https://ichef.bbci.co.uk/news/640/cpsprodpb/DED5/production/_104154075_gettyimages-154948449.jpg"
                alt="Lhama 8" class="lhama tam-1">
        </div>
    </section>
</body>

</html>
